
pre-commit:
  jobs:
    - name: biome
      glob: '*.{js,jsx,ts,tsx,json,jsonc,css}'
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck

    - name: unit-tests
      run: pnpm test

    - name: production-build
      run: pnpm build
